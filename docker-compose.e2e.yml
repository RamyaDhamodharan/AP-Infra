services:
  postgres:
    container_name: null
    environment:
      POSTGRES_USER: ap_e2e_user
      POSTGRES_PASSWORD: e2e-only-postgres-password
      POSTGRES_DB: genworx_ap_e2e
    ports: !override
      - "127.0.0.1:15433:5432"
    volumes:
      - e2e-postgres-data:/var/lib/postgresql/data

  auth:
    container_name: null
    ports: !override
      - "127.0.0.1:18001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ap_e2e_user:e2e-only-postgres-password@postgres:5432/genworx_ap_e2e
      JWT_SECRET_KEY: e2e-only-jwt-signing-key-change-me

  minio:
    container_name: null
    ports: !override
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    environment:
      MINIO_ROOT_USER: e2e-minio-user
      MINIO_ROOT_PASSWORD: e2e-only-minio-password
    volumes:
      - e2e-minio-data:/data

  redis:
    container_name: null
    ports: !override
      - "127.0.0.1:16379:6379"

  worker:
    container_name: null
    environment:
      APP_ENV: e2e
      LLM_PROVIDER: stub
      DATABASE_URL: postgresql+psycopg://ap_e2e_user:e2e-only-postgres-password@postgres:5432/genworx_ap_e2e
      JWT_SECRET_KEY: e2e-only-jwt-signing-key-change-me
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: e2e-minio-user
      MINIO_SECRET_KEY: e2e-only-minio-password
      MINIO_BUCKET: ap-documents
      IMAP_HOST: greenmail
      IMAP_PORT: "3143"
      IMAP_USE_SSL: "false"
      IMAP_USER: ap-test@localhost
      IMAP_PASSWORD: test-only-password
      EMAIL_POLL_ENABLED: "true"
      EMAIL_POLL_INTERVAL_SECONDS: "30"
      EMAIL_POLL_INITIAL_LOOKBACK_HOURS: "0"

  beat:
    container_name: null
    environment:
      APP_ENV: e2e
      LLM_PROVIDER: stub
      DATABASE_URL: postgresql+psycopg://ap_e2e_user:e2e-only-postgres-password@postgres:5432/genworx_ap_e2e
      JWT_SECRET_KEY: e2e-only-jwt-signing-key-change-me
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: e2e-minio-user
      MINIO_SECRET_KEY: e2e-only-minio-password
      MINIO_BUCKET: ap-documents
      IMAP_HOST: greenmail
      IMAP_PORT: "3143"
      IMAP_USE_SSL: "false"
      IMAP_USER: ap-test@localhost
      IMAP_PASSWORD: test-only-password
      EMAIL_POLL_ENABLED: "true"
      EMAIL_POLL_INTERVAL_SECONDS: "30"
      EMAIL_POLL_INITIAL_LOOKBACK_HOURS: "0"

  core:
    container_name: null
    ports: !override
      - "127.0.0.1:18000:8000"
    environment:
      APP_ENV: e2e
      LLM_PROVIDER: stub
      DATABASE_URL: postgresql+psycopg://ap_e2e_user:e2e-only-postgres-password@postgres:5432/genworx_ap_e2e
      JWT_SECRET_KEY: e2e-only-jwt-signing-key-change-me
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: e2e-minio-user
      MINIO_SECRET_KEY: e2e-only-minio-password
      MINIO_BUCKET: ap-documents
      IMAP_HOST: greenmail
      IMAP_PORT: "3143"
      IMAP_USE_SSL: "false"
      IMAP_USER: ap-test@localhost
      IMAP_PASSWORD: test-only-password
      EMAIL_POLL_ENABLED: "true"
      EMAIL_POLL_INTERVAL_SECONDS: "30"
      EMAIL_POLL_INITIAL_LOOKBACK_HOURS: "0"

  frontend:
    container_name: null
    profiles:
      - e2e-ui-disabled

  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=ap-test@localhost:test-only-password
    ports:
      - "127.0.0.1:13025:3025"
      - "127.0.0.1:13143:3143"

volumes:
  e2e-postgres-data:
  e2e-minio-data:
